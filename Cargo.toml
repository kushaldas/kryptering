[package]
name = "kryptering"
version = "0.7.0"
edition = "2021"
license = "BSD-2-Clause"
description = "Cryptographic operations library with software (RustCrypto) and HSM (PKCS#11) backends"
repository = "https://github.com/kushaldas/kryptering"
homepage = "https://github.com/kushaldas/kryptering"
keywords = ["cryptography", "pkcs11", "hsm", "rustcrypto", "signing"]
categories = ["cryptography", "authentication"]
rust-version = "1.88"
# MSRV-aware dependency resolution: `cargo update` prefers releases whose
# `rust-version` fits the floor above (e.g. holds aes at 0.9.2 while 0.9.3
# requires 1.89) instead of relying on a manual `--precise` pin.
resolver = "3"

[features]
default = ["rustcrypto", "pkcs11"]
# Exactly one document provider must be selected.  The RustCrypto feature owns
# its whole primitive dependency family so AWS-LC builds never acquire
# RustCrypto implementations through the orthogonal legacy/PQ switches.
rustcrypto = [
    "dep:digest", "dep:sha1", "dep:sha2", "dep:sha3", "dep:hmac",
    "dep:rsa", "dep:ecdsa", "dep:elliptic-curve", "dep:dsa", "dep:p256", "dep:p384", "dep:p521",
    "dep:k256", "dep:bp256", "dep:bp384",
    "dep:aes", "dep:cbc", "dep:aes-gcm", "dep:aes-kw", "dep:ed25519-dalek",
    "dep:ed448-goldilocks", "dep:x448", "dep:x25519-dalek", "dep:hkdf", "dep:pbkdf2",
    "dep:signature",
    "dep:crypto-bigint", "dep:crypto-primes", "dep:md-5", "dep:ripemd", "dep:des", "dep:ml-dsa",
    "dep:slh-dsa", "dep:ml-kem", "dep:pkcs8", "dep:getrandom",
]
aws-lc = ["dep:aws-lc-rs"]
legacy = []
post-quantum = []
pkcs11 = ["dep:cryptoki"]
tls-ring = ["dep:rustls", "rustls/ring"]
tls-aws-lc = ["dep:rustls", "dep:aws-lc-rs", "rustls/aws_lc_rs"]
# FIPS is currently provided exclusively by AWS-LC. Enabling it selects the
# AWS-LC document provider; networking, when enabled, must use `tls-aws-lc`.
fips = ["aws-lc", "aws-lc-rs/fips", "rustls?/fips"]

[dependencies]
thiserror = "2"
digest = { version = "0.11", optional = true }
sha1 = { version = "0.11", features = ["oid"], optional = true }
sha2 = { version = "0.11", features = ["oid"], optional = true }
# sha3 stays on 0.11: sha3 0.12 dropped the `EagerHash` impl that
# `Hmac<D>` (hmac 0.13), hkdf 0.13 and dsa 0.7 require, and moved `Shake256`
# (used by the composite ML-DSA-87-Ed448 prehash) into the `shake` crate.
# ml-kem and slh-dsa also pin sha3 0.11, so this keeps a single copy.
sha3 = { version = "0.11", features = ["oid"], optional = true }
hmac = { version = "0.13", optional = true }
# rsa 0.10 only exists as a release candidate. It is the last crate holding
# the RustCrypto trait wave (digest 0.11 / signature 3 / rand_core 0.10 /
# pkcs8 0.11) and is pinned exactly, like the other pre-release crates, so a
# `cargo update` cannot move its API underneath us. Move to a caret `0.10`
# when the final ships. NOTE: rc.19 is still listed as affected by
# RUSTSEC-2023-0071 (Marvin); see .cargo/audit.toml.
rsa = { version = "=0.10.0-rc.19", optional = true }
# Generic ECDSA keys for curves without their own key aliases (Brainpool).
ecdsa = { version = "0.17", features = ["algorithm", "pkcs8", "der", "std"], optional = true }
# `elliptic_curve::ecdh` for the Brainpool curves (bp256/bp384 have no
# `ecdh` feature of their own).
elliptic-curve = { version = "0.14", default-features = false, features = ["ecdh", "pkcs8", "std"], optional = true }
# dsa 0.7 gates `SigningKey` behind `hazmat`; DSA signing is `legacy`-only.
dsa = { version = "0.7", features = ["hazmat"], optional = true }
p256 = { version = "0.14", features = ["ecdsa", "ecdh"], optional = true }
p384 = { version = "0.14", features = ["ecdsa", "ecdh"], optional = true }
p521 = { version = "0.14", features = ["ecdsa", "ecdh", "pkcs8"], optional = true }
# secp256k1 for JOSE ES256K and ECDH; Schnorr/BIP-340 is deliberately off.
k256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa", "ecdh", "pkcs8", "std"], optional = true }
# Brainpool r1 curves (RFC 5639). 0.14 is the first release line with usable
# arithmetic; there is no RustCrypto crate for brainpoolP512r1.
bp256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa", "pkcs8", "sha256", "std"], optional = true }
bp384 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa", "pkcs8", "sha384", "std"], optional = true }
aes = { version = "0.9", optional = true }
cbc = { version = "0.2", optional = true }
aes-gcm = { version = "0.11", optional = true }
aes-kw = { version = "0.3", optional = true }
ed25519-dalek = { version = "3.0", features = ["alloc", "pkcs8", "rand_core"], optional = true }
# Ed448 is needed by draft-ietf-jose-pq-composite-sigs. This pre-release
# RustCrypto implementation is pinned so draft-vector behavior cannot move
# underneath the composite algorithms without an explicit dependency review.
ed448-goldilocks = { version = "=0.14.0-pre.15", default-features = false, features = ["alloc", "signing", "pkcs8"], optional = true }
# X448 (RFC 7748) on top of the same Goldilocks field arithmetic. The crate
# depends on exactly `ed448-goldilocks ^0.14.0-pre.15`, so the two pins must
# move in lockstep.
x448 = { version = "=0.14.0-pre.12", default-features = false, features = ["static_secrets"], optional = true }
x25519-dalek = { version = "3.0", features = ["static_secrets"], optional = true }
hkdf = { version = "0.13", optional = true }
pbkdf2 = { version = "0.13", optional = true }
signature = { version = "3", features = ["rand_core", "digest"], optional = true }
zeroize = "1.7"
crypto-bigint = { version = "0.7", features = ["alloc", "zeroize"], optional = true }
crypto-primes = { version = "0.7.2", optional = true }
aws-lc-rs = { version = "1.18", optional = true }
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12"], optional = true }

# Legacy (optional)
md-5 = { version = "0.11", features = ["oid"], optional = true }
ripemd = { version = "0.2", features = ["oid"], optional = true }
des = { version = "0.9", optional = true }

# Post-quantum (optional)
ml-dsa = { version = "0.1.0", features = ["pkcs8", "rand_core", "zeroize"], optional = true }
slh-dsa = { version = "0.2.0-rc.5", features = ["zeroize"], optional = true }
# `hazmat` is an empty feature that only un-hides encapsulate_deterministic
# in the docs; we call it with fresh OS entropy because kem 0.3's
# Encapsulate trait only accepts an infallible CryptoRng (see ADR 0001).
ml-kem = { version = "0.3.2", features = ["pkcs8", "zeroize", "hazmat"], optional = true }
# PKCS#8 / SPKI encode-decode traits for the post-quantum key types.
pkcs8 = { version = "0.11", features = ["alloc"], optional = true }
# `getrandom::SysRng` (rand_core 0.10 `TryCryptoRng`) is the single RNG of
# the RustCrypto provider: RSA blinding/PSS/OAEP, DH primality checks and
# the ML-DSA/ML-KEM randomized paths all draw from it (see ADR 0001).
getrandom = { version = "0.4", features = ["sys_rng"], optional = true }

# PKCS#11 (optional, default on; not available on wasm32 because
# cryptoki-sys -> libloading is unix/windows-only).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cryptoki = { version = "0.12.1", optional = true }

[dev-dependencies]
hex = "0.4"
# Provider interoperability fixtures are generated by test-only RustCrypto
# crates, then imported through Kryptering's neutral PKCS#8/SPKI/raw APIs.
# They are dev-only and therefore absent from ordinary AWS-LC feature
# trees (which CI asserts separately).
getrandom = { version = "0.4", features = ["sys_rng"] }
rand_core = "0.10"
rsa = "=0.10.0-rc.19"
p256 = { version = "0.14", features = ["ecdsa", "ecdh", "pkcs8"] }
p384 = { version = "0.14", features = ["ecdsa", "ecdh", "pkcs8"] }
p521 = { version = "0.14", features = ["ecdsa", "ecdh", "pkcs8"] }
k256 = { version = "0.14", features = ["ecdsa", "ecdh", "pkcs8"] }
bp256 = { version = "0.14", features = ["arithmetic", "ecdsa", "pkcs8", "sha256"] }
bp384 = { version = "0.14", features = ["arithmetic", "ecdsa", "pkcs8", "sha384"] }
ed25519-dalek = { version = "3.0", features = ["alloc", "pkcs8", "rand_core"] }
x25519-dalek = { version = "3.0", features = ["static_secrets"] }
x448 = { version = "=0.14.0-pre.12", default-features = false, features = ["static_secrets"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# SoftHSM2 tests use C_InitPIN for raw-byte PINs; matches cryptoki 0.12.
cryptoki-sys = "0.5"
